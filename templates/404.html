{% extends "base.html" %}
{% block title %}Page not found{% endblock %}
{% block content %}
<div class="error-panel">
    <p class="error-code">404</p>
    <h1>Page not found</h1>
    <p>The record or page you requested does not exist or is no longer available.</p>
    <div class="page-actions">
        {% if g.user %}
        <a class="btn btn-primary" href="{{ url_for('dashboard') }}">Go to dashboard</a>
        {% else %}
        <a class="btn btn-primary" href="{{ url_for('login') }}">Sign in</a>
        {% endif %}
    </div>
</div>
{% endblock %}
